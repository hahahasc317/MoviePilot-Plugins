name: 单元测试

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 语法检查
        run: python -m py_compile plugins.v3/*/*.py
      - name: 运行单测
        run: python -m unittest discover -s tests -v
